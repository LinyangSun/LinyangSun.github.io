name: Audit China visitor regions (temporary)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-china-visitors-temporary.yml']
permissions:
  contents: read
jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Read public country and city aggregates only
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, json
          url='https://www.stats4u.net/live/5162609191/stats.json?days=400'
          req=urllib.request.Request(url, headers={'User-Agent':'AcademicSiteAggregateAudit/1.0'})
          try:
              with urllib.request.urlopen(req,timeout=25) as r:
                  print('HTTP_STATUS',r.status)
                  data=json.load(r)
              print('GENERATED', data.get('generated'))
              print('FROM_TO', data.get('from'), data.get('to'))
              print('TOTALS', json.dumps(data.get('totals',{}),ensure_ascii=False))
              selected={'CN','HK','MO','TW'}
              for category in ('countries','regions','cities'):
                  items=data.get(category) or []
                  filt=[x for x in items if x.get('country_code') in selected]
                  print('GROUP',category,'COUNT',len(filt),'ROWS',json.dumps(filt,ensure_ascii=False))
              print('COUNTRY_CODES',json.dumps(sorted(set(x.get('country_code') for x in data.get('countries',[]) if x.get('country_code'))),ensure_ascii=False))
              print('DAILY_RECORDS',len(data.get('daily') or []))
          except Exception as exc:
              print('AGGREGATE_FETCH_ERROR',type(exc).__name__,str(exc)[:300])
              raise
          PY
