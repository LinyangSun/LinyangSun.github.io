name: Verify public Stats4U aggregate API (temporary)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-visitor-stats.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public aggregate JSON shape
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, json
          url="https://www.stats4u.net/live/5162609191/stats.json?days=400"
          try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; SiteIntegrationTest/1.0)"})
              with urllib.request.urlopen(req,timeout=20) as response:
                  print("HTTP:",response.status,"Content-Type:",response.headers.get("content-type"))
                  data=json.load(response)
              if isinstance(data,dict):
                  print("Top-level keys:",list(data))
                  for k,v in data.items():
                      if isinstance(v,dict):
                          print("Object",k,"keys:",list(v)[:30])
                          print("Object",k,"scalars:",{a:b for a,b in v.items() if isinstance(b,(int,float,str,type(None)))})
                      elif isinstance(v,list):
                          print("Array",k,"length:",len(v),"first item:",json.dumps(v[0],ensure_ascii=False)[:600] if v else None)
                      else:
                          print("Scalar",k,repr(v)[:200])
              else:
                  print("Unexpected type",type(data).__name__)
          except Exception as e:
              print("API error:",repr(e))
          PY
