name: Import publications from ORCID
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/import-orcid.mjs
      - .github/workflows/sync-orcid.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import public works from ORCID
        run: node scripts/import-orcid.mjs
      - name: Commit publication records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/content/publications
          if git diff --cached --quiet; then
            echo "Publication records are up to date."
          else
            git commit -m "Import publications from ORCID 0000-0003-1148-0364"
            git push
          fi
