name: Temporary visitor summary 20261108
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-visitor-summary-20261108.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public aggregate stats without individual IPs
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url='https://www.stats4u.net/live/5162609191/stats.json?days=400'
          req=urllib.request.Request(url,headers={'User-Agent':'AcademicWebsiteGeoSummary/1.0'})
          with urllib.request.urlopen(req,timeout=25) as r:
              print('STATUS',r.status)
              data=json.load(r)
          for key in ('generated','from','to','totals','daily','countries','regions','cities'):
              print('SNAP_'+key.upper(),json.dumps(data.get(key),ensure_ascii=False))
          PY
